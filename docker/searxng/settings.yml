# Refactor Workflow Studio — standalone SearXNG container (2026-08-09).
# Carved out of the main Refactor compose stack so SearXNG has its own
# lifecycle, port, volume, and config. Backed up from docker/searxng-config/settings.yml.
# Goal: high signal, low timeout. Disable everything not Drew-relevant.
use_default_settings: false

general:
  debug: false
  instance_name: "Refactor Workflow Studio Docker SearXNG"
  default_doi_resolver: "https://doi.org"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "refactor-searxng-standalone-c47ab0ac5942c862989552ba5a25026a7492a8eba9071d5421e35d36aebf3d8a"
  limiter: false
  image_proxy: false
  method: GET

outgoing:
  request_timeout: 12.0
  max_request_timeout: 30.0
  pool_connections: 100
  pool_maxsize: 20

